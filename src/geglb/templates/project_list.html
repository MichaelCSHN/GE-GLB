<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GE-GLB Dashboard</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; background: #f5f5f5; }
  h1 { color: #333; }
  table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  th, td { padding: .75rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
  th { background: #f9f9f9; }
  .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .status-ok { background: #4caf50; }
  .status-partial { background: #ff9800; }
  .status-missing { background: #f44336; }
  a { color: #1976d2; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>GE-GLB Dashboard</h1>
{% if projects %}
<table>
<thead>
<tr>
  <th>Project</th>
  <th>Source</th>
  <th>Status</th>
  <th>Underbody</th>
  <th>Panorama</th>
  <th>LookAt</th>
  <th>Frames</th>
</tr>
</thead>
<tbody>
{% for p in projects %}
<tr>
  <td><a href="/project/{{ p.name }}">{{ p.name }}</a></td>
  <td>{{ p.source_kind }}</td>
  <td>{{ p.status }}</td>
  <td><span class="status-dot {{ 'status-ok' if p.has_product.underbody else 'status-missing' }}"></span></td>
  <td><span class="status-dot {{ 'status-ok' if p.has_product.panorama else 'status-missing' }}"></span></td>
  <td><span class="status-dot {{ 'status-ok' if p.has_product.lookat else 'status-missing' }}"></span></td>
  <td>{{ p.image_frames }}</td>
</tr>
{% endfor %}
</tbody>
</table>
{% else %}
<p>No projects found.  Run a capture workflow to populate the build directory.</p>
{% endif %}
</body>
</html>
