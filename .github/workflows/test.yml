name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build example artifacts
        run: >-
          PYTHONPATH=src python -m geglb plan
          --config examples/mvp.toml
          --route examples/route.kml
          --out build/mvp
