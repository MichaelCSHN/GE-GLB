[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ge-glb"
version = "0.3.0"
description = "Google Earth Pro capture planning for transparent-vehicle BEV research"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "GE-GLB contributors" }]
dependencies = []

[project.optional-dependencies]
stitch = ["numpy>=1.26", "Pillow>=10"]
dev = ["jsonschema>=4.22", "ruff>=0.12"]
serve = ["fastapi>=0.115", "uvicorn>=0.34", "folium>=0.19"]

[project.scripts]
geglb = "geglb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
